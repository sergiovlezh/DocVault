[project]
name = "backend"
version = "0.1.0"
description = "Backend for DocVault, a self-hosted multi-tenant document management system"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy[asyncio]==2.1.9",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]
